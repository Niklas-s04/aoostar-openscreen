name: Publish approved catalog image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Approved commit SHA or release tag
        type: string
        required: true
      approve_publication:
        description: I approve publishing catalog version 1.0.2
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: inputs.approve_publication
    environment: catalog-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.3'
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: uv sync --project catalog --frozen
      - run: uvx pip-audit --path catalog/.venv/lib/python3.13/site-packages --progress-spinner off
      - name: Configure the reproducible image exporter
        id: builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - run: uv run python scripts/catalog_reproducibility_test.py
        env:
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
      - run: uv run python scripts/catalog_container_test.py
      - name: Block publication on critical or high image findings
        uses: docker/scout-action@4bbf17a9da65a7b5497361bb407e88cc9548f69c # v1
        with:
          command: cves
          image: local://ghcr.io/niklas-s04/aoostar-openscreen-catalog:1.0.2
          only-severities: critical,high
          exit-code: true
          write-comment: false
          dockerhub-user: niklass2004
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push ghcr.io/niklas-s04/aoostar-openscreen-catalog:1.0.2
# Configure required reviewers on catalog-release before enabling this workflow.
# No latest tag, no automatic release creation, no push/tag publication trigger.
