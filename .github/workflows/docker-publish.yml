
name: Publish Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: niklass2004
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GitHub Registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            niklass2004/aoostar-openscreen:${{ steps.version.outputs.value }}
            niklass2004/aoostar-openscreen:latest
            ghcr.io/niklas-s04/aoostar-openscreen:${{ steps.version.outputs.value }}
            ghcr.io/niklas-s04/aoostar-openscreen:latest
