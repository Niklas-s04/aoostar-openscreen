services:
  openscreen:
    build: .
    image: aoostar-openscreen:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENSCREEN_ALLOWED_NETWORKS: 127.0.0.0/8,::1/128,172.30.87.1/32
      OPENSCREEN_ALLOWED_HOSTS: localhost,127.0.0.1,::1
      OPENSCREEN_ALLOWED_SOURCE_URLS: ${OPENSCREEN_ALLOWED_SOURCE_URLS:-}
    volumes:
      - openscreen-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  openscreen-data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.87.0/24
