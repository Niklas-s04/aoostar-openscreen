[project]
name = "aoostar-openscreen"
version = "0.2.1"
description = "Independent AOOSTAR WTR Max display dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pillow>=11,<13",
    "pyserial==3.5",
    "psutil>=7,<8",
    "httpx>=0.28,<1",
    "websocket-client>=1.8,<2",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
