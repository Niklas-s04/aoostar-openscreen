{% set tpl = ix_lib.base.render.Render(values) %}
{% if values.network.get('host_network', false) %}
  {% do tpl.funcs.fail('Host networking is not supported') %}
{% endif %}
{% if values.storage.data.type not in ['ix_volume', 'host_path'] %}
  {% do tpl.funcs.fail('Only assigned ixVolume or host path storage is supported') %}
{% endif %}
{% if values.storage.data.type == 'host_path' %}
  {% set store = values.storage.data.host_path_config %}
  {% set path = store.acl.path if store.get('acl_enable', false) else store.path %}
  {% if path in ['/', '/mnt'] or '..' in path.split('/') or path.endswith('.sock') %}
    {% do tpl.funcs.fail('A dedicated data directory is required') %}
  {% endif %}
  {% for protected in ['/dev', '/sys', '/proc', '/etc', '/var', '/run', '/usr', '/boot', '/root', '/home', '/conf', '/audit', '/mnt/.ix-apps'] %}
    {% if path == protected or path.startswith(protected + '/') %}
      {% do tpl.funcs.fail('System directories cannot be assigned as application data') %}
    {% endif %}
  {% endfor %}
{% endif %}
{% set c1 = tpl.add_container(values.consts.container_name, 'image') %}
{% do c1.set_user(10001, 10001) %}
{% do c1.set_read_only(true) %}
{% do c1.healthcheck.use_built_in() %}
{% do c1.environment.add_env('OPENSCREEN_ALLOWED_HOSTS', values.openscreen.allowed_hosts) %}
{% do c1.environment.add_env('OPENSCREEN_ALLOWED_NETWORKS', values.openscreen.allowed_networks) %}
{% do c1.add_port(values.network.web_port, {'container_port': 8080}) %}
{% do c1.add_storage('/data', values.storage.data) %}
{% do c1.add_storage('/tmp', {'type': 'tmpfs', 'tmpfs_config': {'size': 64, 'mode': '0700', 'uid': 10001, 'gid': 10001}}) %}
{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}
{{ tpl.render() | tojson }}
