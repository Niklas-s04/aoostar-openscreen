{
  "resources": {
    "limits": {
      "cpus": 2,
      "memory": 512
    }
  },
  "openscreen": {
    "allowed_hosts": "localhost,127.0.0.1,::1",
    "allowed_networks": "127.0.0.0/8,::1/128"
  },
  "network": {
    "host_network": false,
    "web_port": {
      "bind_mode": "published",
      "port_number": 32176,
      "host_ips": []
    }
  },
  "ix_volumes": {
    "data": "/opt/tests/aoostar-openscreen/data"
  },
  "storage": {
    "data": {
      "type": "ix_volume",
      "ix_volume_config": {
        "dataset_name": "data",
        "create_host_path": true
      }
    }
  }
}
