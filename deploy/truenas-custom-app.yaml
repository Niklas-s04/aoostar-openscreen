# Replace every YOUR_* placeholder before deploying. See README.md.
# Create the data path with UID 10001 access and import the image first.
services:
  openscreen:
    image: aoostar-openscreen:local
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "YOUR_NAS_IP:8088:8080"
    environment:
      OPENSCREEN_ALLOWED_NETWORKS: 127.0.0.0/8,::1/128,YOUR_LAN_CIDR
      OPENSCREEN_ALLOWED_HOSTS: localhost,127.0.0.1,::1,YOUR_NAS_IP
      # Optional sources must match this operator-owned allowlist exactly.
      OPENSCREEN_ALLOWED_SOURCE_URLS: ""
    volumes:
      - type: bind
        source: /mnt/YOUR_POOL/apps/openscreen/data
        target: /data
        bind:
          create_host_path: false
    # For a WebUI-only first start, remove devices AND group_add.
    devices:
      - "/dev/serial/by-id/YOUR_DISPLAY_ID:/dev/aoostar"
    group_add:
      - "YOUR_DEVICE_GID"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
