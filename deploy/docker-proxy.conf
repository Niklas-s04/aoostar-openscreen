# Internal, read-only endpoint allowlist. Never publish this proxy to the LAN.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  upstream engine { server unix:/var/run/docker.sock; }
  server {
    listen 2375;
    server_tokens off;
    location = /version {
      limit_except GET { deny all; }
      proxy_pass http://engine;
    }
    location ~ ^/v1\.[0-9]+/containers/json$ {
      limit_except GET { deny all; }
      proxy_pass http://engine;
    }
    location ~ ^/v1\.[0-9]+/containers/[a-f0-9]+/(json|stats)$ {
      limit_except GET { deny all; }
      proxy_pass http://engine;
    }
    location / { return 403; }
  }
}
